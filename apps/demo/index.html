<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kasane finance workspace · Tabular UI demo</title>
    <meta
      name="description"
      content="A finance workspace with specialist AI agents, played as the Group Controller at Kasane Corporation, a fictional Tokyo printer maker. Built with Tabular UI."
    />
    <!-- Tabular favicons (art direction, 2026-10-22): the SVG switches to a framed mark in dark mode. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://demo.tabularui.com/" />
    <meta property="og:title" content="Kasane finance workspace · Tabular UI demo" />
    <meta
      property="og:description"
      content="Work through a fictional company's findings with its finance team and its specialist agents. Every screen is built from Tabular UI."
    />
    <meta property="og:image" content="https://demo.tabularui.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <!--
      The mode a returning visitor chose in the account menu, before first paint.
      Without it, a dark choice paints light until React runs. useTheme() in
      App.tsx owns data-theme from then on; the key is its default, tui-theme.
    -->
    <script>
      try {
        var t = localStorage.getItem('tui-theme');
        if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
