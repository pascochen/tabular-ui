name: Update visual baselines

# Approves a deliberate visual change that was not declared in the PR
# description (declared ones are committed by ci.yml's "Visual changes" job;
# CONTRIBUTING.md, "Visual changes"). Regenerates every story's screenshot on
# Linux (the only platform the baselines are valid for) and commits whatever
# changed to the branch. The diff of that commit is the review: GitHub shows
# each changed PNG side by side.
#
# It does not start CI itself. GitHub queues the PR's own CI run for the
# robot's commit and holds it ("1 workflow awaiting approval"): approve it on
# the PR, and that run is the Verify check the PR page shows. One run, in the
# place people look. (Until 2026-10-09 this workflow dispatched a second run
# of its own; a PR then merged on that run while the PR page still showed
# Verify unfinished.)
#
# Two ways to run it:
#   - add the `update-visual-baselines` label to a PR (works before this file
#     is on main, so it is how a PR that adds stories gets its baselines)
#   - Actions → Update visual baselines → Run workflow, on your branch
#
# Never on main: baselines change in a PR, where someone looks at them.

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:

concurrency:
  group: visual-baselines-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  update:
    name: Update baselines
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref_name != 'main') ||
      (github.event_name == 'pull_request' &&
       github.event.label.name == 'update-visual-baselines' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # commit the new baselines
      pull-requests: write # remove the label, so it can be re-applied
    env:
      BRANCH: ${{ github.head_ref || github.ref_name }}

    steps:
      - uses: actions/checkout@v7
        with:
          # A pull_request event checks out the merge commit by default; the
          # baselines must be committed to the branch itself.
          ref: ${{ env.BRANCH }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter tabular-ui-storybook exec playwright install --with-deps chromium

      # Delete, then regenerate all: a renamed or removed story leaves no
      # orphaned screenshot behind. Unchanged stories re-encode to identical
      # bytes, so git only sees the ones that actually changed.
      - name: Regenerate screenshots
        run: |
          rm -f apps/storybook/tests/visual.spec.ts-snapshots/*-linux.png
          pnpm test:visual --update-snapshots=all

      - name: Commit changed baselines
        id: commit
        run: |
          git add -A apps/storybook/tests/visual.spec.ts-snapshots
          if git diff --cached --quiet; then
            echo "No screenshot changed."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --cached --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Never put a skip-CI token in this message. A squash merge copies
          # every commit message into the merge commit on main, so the token
          # would skip main's CI after every PR that used this workflow. The
          # PR's CI run for this commit waits for approval; that is intended
          # (see the header).
          git commit -m "Update visual baselines" -m "Regenerated by the Update visual baselines workflow, run ${{ github.run_id }}."
          git push origin "HEAD:$BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Remove the label
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr edit ${{ github.event.pull_request.number }} --remove-label update-visual-baselines --repo ${{ github.repository }}
