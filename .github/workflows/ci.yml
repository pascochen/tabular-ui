name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Re-run CI on a branch by hand: gh workflow run ci.yml --ref <branch>.
  # Not used to gate a merge: a PR merges on the Verify its own page shows.
  workflow_dispatch:

# A superseded run tells you nothing; cancel it rather than pay for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    # Storybook cold-boots for the Playwright specs, and the visual step
    # screenshots every story twice, so this is not a 5-minute job. A clean
    # run takes 25-27 minutes. A PR that declares many visual changes renders
    # each changed screenshot again on retry: #102 (22 story files) was cut
    # off at 30 inside the visual step, before the baselines were recorded.
    timeout-minutes: 45
    # Read-only. The visual step reads this PR's comments (below); everything
    # that writes is in the "Visual changes" job, which installs nothing.
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      visual-gate: ${{ steps.visual.outputs.gate }}
      visual-accept: ${{ steps.visual.outputs.accept }}
      visual-comment: ${{ steps.visual.outputs.comment }}

    steps:
      - uses: actions/checkout@v7
        with:
          # A pull_request run checks out the merge of the PR into main. Depth
          # 2 brings its first parent, main, so the next step can diff the two.
          fetch-depth: 2

      # A PR that changes only Markdown (READMEs, docs/, CLAUDE.md, tools.md)
      # skips everything below and passes in about a minute, instead of ~20.
      # No test, build or story reads a .md file (.mdx is Storybook's, so it
      # does not count). Pushes to main always run in full, and so does any
      # PR whose file list can't be read. Skipped, not cancelled: Verify still
      # reports pass, so a required check is satisfied (2026-10-10, after the
      # month's Actions minutes ran out).
      #
      # A PR that changes only apps/site (and Markdown) is site_only: it skips
      # the library's story tests, design system specs and visual regression,
      # which cover nothing it changed, and runs lint, type-check, the site
      # build and the site tests (docs/site.md §10). Any change outside
      # apps/site, the package included, runs everything plus the site.
      - name: Scope
        id: scope
        run: |
          docs_only=false
          site_only=false
          if [ "${{ github.event_name }}" = "pull_request" ] && files=$(git diff --name-only HEAD^1 HEAD 2>/dev/null) && [ -n "$files" ]; then
            echo "Changed files:"; echo "$files"
            if ! echo "$files" | grep -qvE '\.md$'; then
              docs_only=true
            elif ! echo "$files" | grep -qvE '(^apps/site/|\.md$)'; then
              site_only=true
            fi
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "site_only=$site_only" >> "$GITHUB_OUTPUT"
          if [ "$docs_only" = true ]; then
            echo "Docs-only change: every changed file is Markdown, so install, lint, tests and builds are skipped." | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ "$site_only" = true ]; then
            echo "Site-only change: every changed file is in apps/site or Markdown, so the library's story tests, specs and screenshots are skipped." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Full verification."
          fi

      # Reads the pnpm version from package.json's `packageManager` field.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.scope.outputs.docs_only != 'true'

      - uses: actions/setup-node@v7
        if: steps.scope.outputs.docs_only != 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        if: steps.scope.outputs.docs_only != 'true'
        run: pnpm install --frozen-lockfile

      # tools.md is explicit: "Run `pnpm lint` before any other verification."
      # It encodes six of the design-system checklist items and runs in
      # milliseconds, so a token violation fails here rather than 15 minutes in.
      - name: Lint
        if: steps.scope.outputs.docs_only != 'true'
        run: pnpm lint

      # Both suites drive the same browser: vitest runs every story in headless
      # Chromium, and the Playwright specs measure computed styles in it.
      # --with-deps because ubuntu-latest is missing some of the shared
      # libraries Chromium needs; the repo's own `pretest` hook omits them
      # because it assumes a developer machine that already has them.
      - name: Install Chromium
        if: steps.scope.outputs.docs_only != 'true'
        run: pnpm --filter tabular-ui-storybook exec playwright install --with-deps chromium

      # The library, the Storybook app (its specs and configs) and the demo.
      # The stories are type-checked with the library, where they live.
      - name: Type-check
        if: steps.scope.outputs.docs_only != 'true'
        run: pnpm typecheck

      - name: Story tests
        if: steps.scope.outputs.docs_only != 'true' && steps.scope.outputs.site_only != 'true'
        run: pnpm test

      # In order: the package (JavaScript, types, CSS), the shadcn registry
      # into Storybook's public/r, Storybook, then the demo. The demo builds
      # against the package's dist/ and its published declarations, as any
      # consuming app does: a PR that drops a name from src/index.ts or
      # changes a component's props fails here, not in someone's app. The site
      # builds last, the same way.
      - name: Build
        id: build
        if: steps.scope.outputs.docs_only != 'true' && steps.scope.outputs.site_only != 'true'
        run: pnpm build

      # A site-only change needs the package's dist/ and the site, nothing else.
      - name: Build (site only)
        id: build-site
        if: steps.scope.outputs.site_only == 'true'
        run: pnpm build:ui && pnpm build:site

      # The two checks tools.md reserves for a real browser: focus-ring
      # clipping inside overflow:hidden, and computed OKLCH contrast.
      - name: Design system specs
        if: steps.scope.outputs.docs_only != 'true' && steps.scope.outputs.site_only != 'true'
        id: specs
        run: pnpm test:playwright

      # Every story, dark and light, against the approved screenshots in
      # apps/storybook/tests/visual.spec.ts-snapshots/. A failure here means a component looks
      # different.
      #
      # On a PR, apps/storybook/scripts/visual-gate.mjs then sorts what changed. Story files
      # the PR description declared under "Visual changes" (CONTRIBUTING.md) pass, and
      # their new screenshots go to the "Visual changes" job below to commit.
      # Anything undeclared fails as before: if it was the intent, add the
      # `update-visual-baselines` label to approve the new look.
      #
      # The declaration is the PR body as it was when this run's event fired,
      # so a re-run reads the same one. Earlier comments are read so a file
      # that already needed review here can't be declared after the fact.
      - name: Visual regression (screenshots)
        id: visual
        # Still runs when only the specs above failed, so one PR shows both.
        if: ${{ steps.scope.outputs.docs_only != 'true' && steps.scope.outputs.site_only != 'true' && (success() || (failure() && steps.specs.outcome == 'failure')) }}
        env:
          VISUAL_GATE: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]' && 'pr' || 'off' }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          OTHER_STEPS_OK: ${{ steps.specs.outcome == 'success' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$VISUAL_GATE" = pr ]; then
            PRIOR_COMMENT=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- tui-visual-changes -->"))) | .body')
            export PRIOR_COMMENT
          fi
          node apps/storybook/scripts/visual-gate.mjs

      # The site's pages, prerendered, in a real browser: page structure and
      # axe at WCAG 2.2 AA (docs/site.md §11). Runs whenever a build succeeded,
      # even if the specs or screenshots above failed, so one run shows both.
      - name: Site tests
        id: site
        if: ${{ !cancelled() && (steps.build.outcome == 'success' || steps.build-site.outcome == 'success') }}
        run: pnpm test:site

      - name: Upload visual gate
        if: ${{ !cancelled() && steps.visual.outputs.gate == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: visual-gate
          path: apps/storybook/visual-gate/
          retention-days: 7

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/storybook/playwright-report/
          retention-days: 7

      - name: Upload site test report
        if: ${{ failure() && steps.site.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: site-playwright-report
          path: apps/site/playwright-report/
          retention-days: 7

      # Open index.html: each changed story shows expected, actual and a diff.
      - name: Upload visual diff report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-diff-report
          path: apps/storybook/visual-report/
          retention-days: 7

  # Commits the screenshots of declared visual changes, and keeps the PR's
  # "Visual changes" comment. Not a required check.
  #
  # The commit it pushes differs from the commit Verify just passed only by
  # the screenshots Verify rendered, so it marks that commit Verify ✓ itself
  # rather than waiting for a second 20-minute run that GitHub would hold for
  # approval anyway (a commit pushed by Actions can't start a workflow on its
  # own). That run still appears as "awaiting approval"; approving it is
  # harmless. If main moves, branch protection's up-to-date rule forces a real
  # run, so the shortcut never covers code Verify didn't test.
  #
  # Write access, so it installs no dependencies and runs no repo code: git,
  # gh and the files Verify uploaded.
  visual-changes:
    name: Visual changes
    needs: verify
    if: ${{ !cancelled() && needs.verify.outputs.visual-gate == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # commit the screenshots
      checks: write # mark that commit Verify ✓
      issues: write # PR comments are issue comments
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BRANCH: ${{ github.head_ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: visual-gate
          path: ${{ runner.temp }}/visual-gate

      - uses: actions/checkout@v7
        if: needs.verify.outputs.visual-accept == 'true'
        with:
          ref: ${{ github.head_ref }}

      - name: Commit the declared screenshots
        id: commit
        if: needs.verify.outputs.visual-accept == 'true'
        run: |
          gate="$RUNNER_TEMP/visual-gate"
          dir=apps/storybook/tests/visual.spec.ts-snapshots
          # A push since this run started makes a newer run, which takes over.
          if [ "$(git rev-parse HEAD)" != "$HEAD_SHA" ]; then
            echo "The branch moved on since $HEAD_SHA; not committing."
            echo "outcome=moved" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          valid='^[a-z0-9-]+-chromium-linux\.png$'
          for f in "$gate"/accept/*.png; do
            name=$(basename "$f")
            [[ "$name" =~ $valid ]] || { echo "Unexpected file name: $name"; exit 1; }
            cp "$f" "$dir/$name"
          done
          # Baselines of stories that no longer exist.
          while IFS= read -r name || [ -n "$name" ]; do
            [[ "$name" =~ $valid ]] && git rm -q --ignore-unmatch "$dir/$name"
          done < "$gate/orphans.txt"
          git add -A "$dir"
          if git diff --cached --quiet; then
            echo "outcome=unchanged" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --cached --stat
          files=$(jq -r '[.accepted[].key | split("/") | last] | join(", ")' "$gate/result.json")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Never put a skip-CI token in this message (CLAUDE.md, failure log).
          git commit -q -m "Accept declared visual changes" \
            -m "Screenshots of $files, declared in the PR description. Rendered by CI run $GITHUB_RUN_ID, which verified $HEAD_SHA."
          # The claim the check below makes: nothing but screenshots changed.
          if git diff --name-only "$HEAD_SHA" HEAD | grep -qv "^$dir/[^/]*\.png$"; then
            echo "The commit changes more than screenshots; refusing."; exit 1
          fi
          git push -q origin "HEAD:$BRANCH"
          sha=$(git rev-parse HEAD)
          gh api "repos/$GITHUB_REPOSITORY/check-runs" -X POST \
            -f name=Verify -f head_sha="$sha" -f status=completed -f conclusion=success \
            -f "output[title]=Screenshots accepted from run $GITHUB_RUN_ID" \
            -f "output[summary]=Not a fresh run. This commit is $HEAD_SHA, which [run $GITHUB_RUN_ID]($RUN_URL) verified, plus the screenshots that run rendered for the story files declared in the PR description ($files). Nothing else changed." \
            > /dev/null
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "outcome=committed" >> "$GITHUB_OUTPUT"

      - name: Comment on the PR
        env:
          WANTED: ${{ needs.verify.outputs.visual-comment }}
          OUTCOME: ${{ steps.commit.outputs.outcome }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          case "$OUTCOME" in
            committed) text="Committed as $SHA, and marked Verify ✓ on the strength of this run. Review the images in the Files tab: that is approving the new look. GitHub also lists \"1 workflow awaiting approval\" for that commit; it can be left." ;;
            moved) text="Not committed: the branch moved on after this run started, and the run for the newer push takes over." ;;
            unchanged) text="Nothing to commit: the branch already has these screenshots." ;;
            *) text="Not committed: the step that commits them failed. See [the run]($RUN_URL)." ;;
          esac
          awk -v t="$text" '$0 == "ACCEPT_OUTCOME" { print t; next } { print }' \
            "$RUNNER_TEMP/visual-gate/comment.md" > "$RUNNER_TEMP/comment.md"
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- tui-visual-changes -->"))) | .id' | tail -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F "body=@$RUNNER_TEMP/comment.md" > /dev/null
          elif [ "$WANTED" = true ]; then
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -F "body=@$RUNNER_TEMP/comment.md" > /dev/null
          fi
